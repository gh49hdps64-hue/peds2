<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pediatric Dentistry Exam 2 — Practice Test</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0c0e14;
    --surface: #13151f;
    --surface2: #1a1d2b;
    --surface3: #20243a;
    --border: #272b40;
    --border2: #333858;
    --accent: #6ee7b7;
    --accent2: #818cf8;
    --accent3: #fb923c;
    --correct: #34d399;
    --wrong: #f87171;
    --text: #e2e8f8;
    --muted: #6b7494;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
    --display: 'Syne', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-weight: 300;
    min-height: 100vh;
  }

  .progress-wrap {
    height: 2px;
    background: var(--border);
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 300;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
    transition: width 0.4s ease;
    width: 0%;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 200;
    backdrop-filter: blur(8px);
    flex-wrap: wrap;
    gap: 10px;
  }
  .header-left h1 {
    font-family: var(--display);
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: var(--accent);
    text-transform: uppercase;
  }
  .header-left .subtitle {
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--muted);
    margin-top: 3px;
    letter-spacing: 0.05em;
  }
  .score-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .score-pill {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 14px;
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .score-pill span { color: var(--accent); font-weight: 500; }
  .reset-btn-header {
    background: transparent;
    border: 1px solid var(--border2);
    color: var(--muted);
    border-radius: 20px;
    padding: 5px 14px;
    font-family: var(--mono);
    font-size: 0.72rem;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .reset-btn-header:hover { border-color: var(--accent3); color: var(--accent3); }

  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 48px 24px 100px;
  }

  .section-label {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 56px 0 22px;
  }
  .section-label:first-of-type { margin-top: 0; }
  .section-num {
    font-family: var(--display);
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    color: var(--bg);
    background: var(--accent2);
    padding: 3px 10px;
    border-radius: 4px;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .section-title {
    font-family: var(--display);
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.01em;
  }
  .section-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .q-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px 26px;
    margin-bottom: 12px;
    transition: border-color 0.25s, box-shadow 0.25s;
  }
  .q-card:hover { border-color: var(--border2); }
  .q-card.answered-correct {
    border-color: rgba(52,211,153,0.45);
    box-shadow: 0 0 0 1px rgba(52,211,153,0.12) inset;
  }
  .q-card.answered-wrong {
    border-color: rgba(248,113,113,0.45);
    box-shadow: 0 0 0 1px rgba(248,113,113,0.1) inset;
  }

  .q-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .q-num {
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--muted);
    background: var(--surface3);
    border: 1px solid var(--border);
    padding: 2px 9px;
    border-radius: 5px;
  }

  .q-text {
    font-size: 0.93rem;
    line-height: 1.65;
    color: var(--text);
    font-weight: 400;
    margin-bottom: 16px;
  }

  .options { display: flex; flex-direction: column; gap: 7px; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: left;
    width: 100%;
    color: var(--text);
    font-family: var(--sans);
    font-size: 0.87rem;
    font-weight: 300;
    line-height: 1.55;
  }
  .opt:hover:not(:disabled) {
    border-color: var(--accent);
    background: rgba(110,231,183,0.06);
  }
  .opt:disabled { cursor: default; }

  .opt-letter {
    font-family: var(--mono);
    font-size: 0.7rem;
    font-weight: 500;
    color: var(--muted);
    background: var(--surface3);
    width: 22px;
    height: 22px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
    transition: all 0.15s;
  }

  .opt.correct-ans { border-color: var(--correct) !important; background: rgba(52,211,153,0.1) !important; }
  .opt.correct-ans .opt-letter { background: var(--correct); color: #0c0e14; }
  .opt.wrong-ans { border-color: var(--wrong) !important; background: rgba(248,113,113,0.09) !important; }
  .opt.wrong-ans .opt-letter { background: var(--wrong); color: #0c0e14; }
  .opt.reveal-correct { border-color: rgba(52,211,153,0.35) !important; background: rgba(52,211,153,0.05) !important; }
  .opt.reveal-correct .opt-letter { color: var(--correct); background: rgba(52,211,153,0.15); }

  .feedback {
    margin-top: 12px;
    padding: 11px 16px;
    border-radius: 8px;
    font-size: 0.84rem;
    line-height: 1.6;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.correct-fb { background: rgba(52,211,153,0.09); border: 1px solid rgba(52,211,153,0.28); color: #86efcb; }
  .feedback.wrong-fb { background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.24); color: #fca5a5; }
  .feedback strong { font-weight: 500; }


  .q-tag {
    font-family: var(--mono);
    font-size: 0.66rem;
    color: var(--accent3);
    border: 1px solid rgba(251,146,60,0.35);
    padding: 2px 9px;
    border-radius: 5px;
  }
  .opt.multi .opt-letter { border-radius: 50%; }
  .opt.selected { border-color: var(--accent2); background: rgba(129,140,248,0.1); }
  .opt.selected .opt-letter { background: var(--accent2); color: #0c0e14; }
  .check-btn {
    margin-top: 12px;
    background: transparent;
    border: 1px solid var(--accent2);
    color: var(--accent2);
    border-radius: 8px;
    padding: 8px 16px;
    font-family: var(--mono);
    font-size: 0.75rem;
    cursor: pointer;
  }
  .check-btn:disabled { opacity: 0.4; cursor: default; }
  .check-btn:not(:disabled):hover { background: rgba(129,140,248,0.1); }
  .review-bar { margin-top: 40px; text-align: center; }
  .review-btn {
    background: transparent;
    border: 1px solid var(--wrong);
    color: var(--wrong);
    border-radius: 8px;
    padding: 12px 22px;
    font-family: var(--mono);
    font-size: 0.8rem;
    cursor: pointer;
    width: 100%;
    max-width: 360px;
  }
  .review-btn:not(:disabled):hover { background: rgba(248,113,113,0.08); }
  .review-btn:disabled { opacity: 0.35; cursor: default; }
  .review-note { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); margin-top: 8px; }
  .review-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    background: rgba(248,113,113,0.07);
    border: 1px solid rgba(248,113,113,0.3);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 24px;
    font-family: var(--mono); font-size: 0.78rem; color: #fca5a5;
  }

  .type-row { display: flex; gap: 8px; }
  .type-input {
    flex: 1; min-width: 0;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 14px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    outline: none;
  }
  .type-input:focus { border-color: var(--accent); }
  .type-input.in-correct { border-color: var(--correct); background: rgba(52,211,153,0.08); }
  .type-input.in-wrong { border-color: var(--wrong); background: rgba(248,113,113,0.07); color: #fca5a5; text-decoration: line-through; }
  .type-input.in-blank { border-color: var(--wrong); }
  .type-row .check-btn { margin-top: 0; }
  .link-btn {
    background: none; border: none; padding: 0; margin-top: 10px;
    color: var(--muted); font-family: var(--mono); font-size: 0.72rem; cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .link-btn:hover { color: var(--text); }
  .override-btn {
    margin-left: 8px; background: transparent; border: 1px solid rgba(252,165,165,0.5);
    color: #fca5a5; border-radius: 6px; padding: 2px 9px; font-family: var(--mono); font-size: 0.7rem; cursor: pointer;
  }
  .override-btn:hover { border-color: var(--correct); color: var(--correct); }


  .mode-toggle {
    display: inline-flex;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px;
  }
  .mode-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    border-radius: 16px;
    padding: 4px 12px;
    font-family: var(--mono);
    font-size: 0.72rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .mode-btn.active { background: var(--accent); color: #0c0e14; font-weight: 500; }
  .mode-btn:not(.active):hover { color: var(--text); }

  .type-hint { font-family: var(--mono); font-size: 0.72rem; color: var(--accent3); margin-bottom: 8px; }


  /* Only the score row stays pinned while scrolling */
  header { position: relative; top: auto; z-index: auto; backdrop-filter: none; border-bottom: none; padding-bottom: 12px; }
  .score-bar.sticky-bar {
    position: sticky;
    top: 0;
    z-index: 200;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 36px;
    justify-content: flex-start;
  }
  .sticky-bar .bar-spacer { flex: 1; }
  @media (max-width: 600px) {
    .score-bar.sticky-bar { padding: 8px 16px; gap: 6px; }
    .sticky-bar .bar-spacer { display: none; }
    .sticky-bar .score-pill, .sticky-bar .reset-btn-header { font-size: 0.7rem; padding: 4px 11px; }
  }

  @media (max-width: 600px) {
    header { padding: 14px 16px; }
    .container { padding: 32px 14px 80px; }
    .q-card { padding: 16px 16px; }
    .header-left h1 { font-size: 0.9rem; }
  }
</style>
</head>
<body>

<div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>

<header>
  <div class="header-left">
    <h1>Pediatric Dentistry — Exam 2 Practice Test</h1>
    <div class="subtitle">Primary Dentition &amp; Occlusion · Eruption &amp; Arch Development · Caries &amp; Prevention · Pulp Therapy &amp; Infant Oral Health</div>
  </div>
  <div class="header-tools">
    <div class="mode-toggle" role="group" aria-label="Answer format">
      <button class="mode-btn" data-mode="mc" onclick="setMode('mc')">Multiple choice</button>
      <button class="mode-btn" data-mode="typed" onclick="setMode('typed')">Type answer</button>
    </div>
  </div>
</header>
<div class="score-bar sticky-bar">
    <div class="score-pill">Answered: <span id="answeredCount">0</span> / <span id="totalCount">0</span></div>
    <div class="score-pill">Score: <span id="scoreCount">0</span> correct</div>
    <span class="bar-spacer"></span>
    <button class="reset-btn-header" onclick="resetAll()">↺ Reset</button>
    <button class="reset-btn-header" onclick="shuffleAll()">⇄ Reset &amp; Shuffle</button>
</div>

let mode = 'mc';
try { if (localStorage.getItem('quizMode') === 'typed') mode = 'typed'; } catch (e) {}
let view = sections;
let fullView = sections;
let reviewing = false;
let missed = {};
let answered = {};
let selected = {};
let scores = { correct: 0, total: 0 };
const letters = ['A','B','C','D','E','F','G','H'];

// ---------- typed-answer matching ----------
function norm(s) {
  return (' ' + s.toLowerCase() + ' ')
    .replace(/[µμ]/g, 'u')
    .replace(/[‐‑‒–—_\/-]/g, ' ')
    .replace(/(\d),(\d{3})/g, '$1$2')
    .replace(/(^|[^0-9])\.|\.(?=[^0-9]|$)/g, '$1 ')
    .replace(/[^a-z0-9. ]/g, ' ')
    .replace(/\b(the|a|an)\b/g, ' ')
    .replace(/\s+/g, ' ').trim();
}
function squash(s) { return norm(s).replace(/\band\b/g, ' ').replace(/ /g, ''); }
function lev(a, b) {
  const m = a.length, n = b.length;
  const d = Array.from({length: m + 1}, (_, i) => [i]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[m][n];
}
function hasTerm(text, term) {
  const n = norm(text), k = norm(term);
  if (!k) return false;
  if ((' ' + n + ' ').includes(k.length <= 3 ? ' ' + k + ' ' : k)) return true;
  if (k.length > 3 && n.replace(/ /g, '').includes(k.replace(/ /g, ''))) return true;
  if (k.length >= 6 && !k.includes(' ')) return n.split(' ').some(w => lev(w, k) <= 1);
  return false;
}
function termPos(text, term) {
  const n = norm(text), k = norm(term);
  const i = (' ' + n + ' ').indexOf(k.length <= 3 ? ' ' + k + ' ' : k);
  if (i >= 0) return i;
  if (k.length >= 6 && !k.includes(' ')) {
    let pos = 0;
    for (const w of n.split(' ')) { if (lev(w, k) <= 1) return pos + 1; pos += w.length + 1; }
  }
  return -1;
}
function hasNot(text, words) {
  const ws = norm(text).split(' ');
  return words.some(n => ws.some(w => w === n || (n.length >= 4 && w.startsWith(n))));
}
const FILLER = new Set(['', 'both', 'all', 'teeth', 'etc', 'also', 'or', 'with', 'of', 'primary', 'permanent', 'the']);
function isCorrect(q, typed) {
  const t = q.typed;
  const s = squash(typed);
  if (!s) return false;
  if (t.not && hasNot(typed, t.not)) return false;
  if (t.aliases) for (const a of t.aliases) {
    const sa = squash(a);
    if (s === sa || s.replace(/s$/, '') === sa.replace(/s$/, '')) return true;
    if (t.fuzzy) {
      const tol = sa.length >= 10 ? 2 : sa.length >= 5 ? 1 : 0;
      if (tol && lev(s, sa) <= tol) return true;
    }
  }
  if (t.keys && t.keys.every(group => group.some(k => hasTerm(typed, k)))) return true;
  if (t.items) {
    const pieces = typed.split(/,|;|\n|\band\b|&|\+|→|->|\bthen\b/i).map(p => p.trim()).filter(p => !FILLER.has(norm(p)));
    // every piece must name one of the required items
    if (!pieces.every(p => t.items.some(item => item.some(k => hasTerm(p, k))))) return false;
    // every required item must be named
    if (!t.items.every(item => item.some(k => hasTerm(typed, k)))) return false;
    if (t.ordered) {
      const pos = t.items.map(item => Math.min(...item.map(k => termPos(typed, k)).filter(i => i >= 0)));
      for (let i = 1; i < pos.length; i++) if (!(pos[i] > pos[i-1])) return false;
    }
    return true;
  }
  return false;
}

// ---------- mode switch ----------
function setMode(m) {
  if (m === mode) return;
  mode = m;
  try { localStorage.setItem('quizMode', m); } catch (e) {}
  syncModeButtons();
  resetAll();
}
function syncModeButtons() {
  document.querySelectorAll('.mode-btn').forEach(b => {
    const on = b.dataset.mode === mode;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on);
  });
}

// ---------- rendering ----------
function buildExam() {
  const container = document.getElementById('examContainer');
  container.innerHTML = '';
  let totalQ = 0;

  if (reviewing) {
    const banner = document.createElement('div');
    banner.className = 'review-banner';
    banner.innerHTML = '<span>Reviewing your incorrect answers</span><button class="reset-btn-header" onclick="exitReview()">← Back to full test</button>';
    container.appendChild(banner);
  }

  view.forEach((section, si) => {
    const secDiv = document.createElement('div');
    secDiv.className = 'section-label';
    secDiv.innerHTML = `<span class="section-num">Set ${section.num || si + 1}</span><span class="section-title"></span><div class="section-line"></div>`;
    secDiv.querySelector('.section-title').textContent = section.label;
    container.appendChild(secDiv);

    section.questions.forEach((q) => {
      totalQ++;
      const card = document.createElement('div');
      card.className = 'q-card';
      card.id = 'card-' + q.id;
      const tag = mode === 'mc' && q.multi ? '<span class="q-tag">Select all that apply</span>' : '';
      card.innerHTML = `<div class="q-meta"><span class="q-num">Q${totalQ}</span>${tag}</div><div class="q-text"></div>`;
      card.querySelector('.q-text').textContent = mode === 'typed' && q.typed.ttext ? q.typed.ttext : q.text;

      if (mode === 'mc') {
        const optWrap = document.createElement('div');
        optWrap.className = 'options';
        q.options.forEach((opt, oi) => {
          const btn = document.createElement('button');
          btn.className = 'opt' + (q.multi ? ' multi' : '');
          btn.id = 'opt-' + q.id + '-' + oi;
          btn.innerHTML = `<span class="opt-letter">${letters[oi]}</span><span></span>`;
          btn.lastChild.textContent = opt;
          btn.addEventListener('click', () => q.multi ? toggleOpt(q, oi) : answerQ(q, oi));
          optWrap.appendChild(btn);
        });
        card.appendChild(optWrap);
        if (q.multi) {
          const check = document.createElement('button');
          check.className = 'check-btn';
          check.id = 'check-' + q.id;
          check.textContent = 'Check answer';
          check.disabled = true;
          check.addEventListener('click', () => checkMulti(q));
          card.appendChild(check);
        }
      } else {
        const wrap = document.createElement('div');
        wrap.innerHTML = (q.typed.hint ? `<div class="type-hint"></div>` : '') + `
          <form class="type-row" autocomplete="off">
            <input class="type-input" id="in-${q.id}" type="text" placeholder="Type your answer" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
            <button class="check-btn" type="submit" id="check-${q.id}">Check</button>
          </form>
          <button class="link-btn" id="show-${q.id}" type="button">Show answer</button>`;
        if (q.typed.hint) wrap.querySelector('.type-hint').textContent = q.typed.hint;
        wrap.querySelector('form').addEventListener('submit', ev => { ev.preventDefault(); submitTyped(q); });
        wrap.querySelector('.link-btn').addEventListener('click', () => revealQ(q));
        card.appendChild(wrap);
      }

      const feedback = document.createElement('div');
      feedback.className = 'feedback';
      feedback.id = 'fb-' + q.id;
      card.appendChild(feedback);
      container.appendChild(card);
    });
  });

  const bar = document.createElement('div');
  bar.className = 'review-bar';
  bar.innerHTML = '<button class="review-btn" id="reviewBtn" onclick="reviewIncorrect()" disabled></button><div class="review-note" id="reviewNote"></div>';
  container.appendChild(bar);

  document.getElementById('totalCount').textContent = totalQ;
  scores.total = totalQ;
  updateReviewBtn();
  updateProgress();
}

function markCard(q, ok, html) {
  answered[q.id] = true;
  if (ok) scores.correct++; else missed[q.id] = true;
  document.getElementById('card-' + q.id).classList.add(ok ? 'answered-correct' : 'answered-wrong');
  const fb = document.getElementById('fb-' + q.id);
  fb.className = 'feedback ' + (ok ? 'correct-fb' : 'wrong-fb') + ' show';
  fb.innerHTML = html;
  updateStats();
}

// ----- multiple choice -----
function answerQ(q, chosen) {
  if (answered[q.id]) return;
  const ok = chosen === q.correct;
  q.options.forEach((_, oi) => {
    const btn = document.getElementById('opt-' + q.id + '-' + oi);
    btn.disabled = true;
    if (oi === q.correct) btn.classList.add(oi === chosen ? 'correct-ans' : 'reveal-correct');
    else if (oi === chosen) btn.classList.add('wrong-ans');
  });
  const ans = `<strong>${letters[q.correct]}. ${esc(q.options[q.correct])}</strong>`;
  markCard(q, ok, ok ? `<strong>✓ Correct!</strong> ${ans}` : `<strong>✗ Incorrect.</strong> The answer is ${ans}`);
}
function toggleOpt(q, oi) {
  if (answered[q.id]) return;
  const set = selected[q.id] || (selected[q.id] = new Set());
  if (set.has(oi)) set.delete(oi); else set.add(oi);
  document.getElementById('opt-' + q.id + '-' + oi).classList.toggle('selected', set.has(oi));
  document.getElementById('check-' + q.id).disabled = set.size === 0;
}
function checkMulti(q) {
  if (answered[q.id]) return;
  const set = selected[q.id] || new Set();
  const right = new Set(q.correct);
  const ok = set.size === right.size && [...set].every(i => right.has(i));
  q.options.forEach((_, oi) => {
    const btn = document.getElementById('opt-' + q.id + '-' + oi);
    btn.disabled = true;
    btn.classList.remove('selected');
    if (right.has(oi)) btn.classList.add(set.has(oi) ? 'correct-ans' : 'reveal-correct');
    else if (set.has(oi)) btn.classList.add('wrong-ans');
  });
  document.getElementById('check-' + q.id).style.display = 'none';
  const ans = q.correct.map(i => `<strong>${letters[i]}. ${esc(q.options[i])}</strong>`).join(', ');
  markCard(q, ok, ok ? `<strong>✓ Correct!</strong> ${ans}` : `<strong>✗ Incorrect.</strong> The correct answers are ${ans}`);
}

// ----- typed -----
function submitTyped(q) {
  if (answered[q.id]) return;
  const input = document.getElementById('in-' + q.id);
  if (!input.value.trim()) { input.focus(); return; }
  finishTyped(q, isCorrect(q, input.value), input.value.trim());
}
function revealQ(q) {
  if (answered[q.id]) return;
  finishTyped(q, false, document.getElementById('in-' + q.id).value.trim());
}
function finishTyped(q, ok, typed) {
  const input = document.getElementById('in-' + q.id);
  input.disabled = true;
  if (!typed) input.placeholder = 'No answer given';
  input.classList.add(ok ? 'in-correct' : typed ? 'in-wrong' : 'in-blank');
  if (!ok) input.blur();
  document.getElementById('check-' + q.id).style.display = 'none';
  document.getElementById('show-' + q.id).style.display = 'none';
  const ans = `<strong>${esc(q.typed.show)}</strong>`;
  markCard(q, ok, ok ? `<strong>✓ Correct!</strong> ${ans}`
    : `<strong>✗ Incorrect.</strong> The answer is ${ans}` + (typed ? ` <button class="override-btn" type="button">Count as correct</button>` : ''));
  const ob = document.querySelector('#fb-' + q.id + ' .override-btn');
  if (ob) ob.addEventListener('click', () => overrideQ(q));
}
// For when your wording was right but didn't match the answer key.
function overrideQ(q) {
  if (!missed[q.id]) return;
  delete missed[q.id];
  scores.correct++;
  document.getElementById('card-' + q.id).classList.replace('answered-wrong', 'answered-correct');
  document.getElementById('in-' + q.id).classList.replace('in-wrong', 'in-correct');
  const fb = document.getElementById('fb-' + q.id);
  fb.className = 'feedback correct-fb show';
  fb.innerHTML = `<strong>✓ Counted as correct.</strong> <strong>${esc(q.typed.show)}</strong>`;
  updateStats();
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function updateStats() {
  document.getElementById('answeredCount').textContent = Object.keys(answered).length;
  document.getElementById('scoreCount').textContent = scores.correct;
  updateReviewBtn();
  updateProgress();
}
function updateProgress() {
  const pct = scores.total ? (Object.keys(answered).length / scores.total * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
}
function updateReviewBtn() {
  const btn = document.getElementById('reviewBtn');
  if (!btn) return;
  const n = Object.keys(missed).length;
  btn.disabled = n === 0;
  btn.textContent = n ? `Review incorrect answers (${n})` : 'Review incorrect answers';
  document.getElementById('reviewNote').textContent = n ? '' : 'Questions you miss will show up here to retry.';
}

function reviewIncorrect() {
  if (!Object.keys(missed).length) return;
  if (!reviewing) fullView = view;
  view = view
    .map((sec, si) => ({ label: sec.label, num: sec.num || si + 1, questions: sec.questions.filter(q => missed[q.id]) }))
    .filter(sec => sec.questions.length);
  reviewing = true;
  resetAll();
}
function exitReview() {
  view = fullView;
  reviewing = false;
  resetAll();
}

function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
// Shuffle question order within each set and answer-choice order within each question.
// Each choice keeps its original index, so the correct answer(s) are remapped exactly.
function shuffleAll() {
  reviewing = false;
  view = sections.map(sec => ({
    label: sec.label,
    questions: shuffled(sec.questions).map(q => {
      const order = shuffled(q.options.map((_, i) => i));
      const correct = q.multi
        ? q.correct.map(c => order.indexOf(c)).sort((a, b) => a - b)
        : order.indexOf(q.correct);
      return Object.assign({}, q, { options: order.map(i => q.options[i]), correct });
    })
  }));
  fullView = view;
  resetAll();
}

function resetAll() {
  answered = {};
  selected = {};
  missed = {};
  scores.correct = 0;
  updateStats();
  buildExam();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

syncModeButtons();
buildExam();
